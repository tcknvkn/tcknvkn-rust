name: CI

on:
  push:
    branches:
      - release
      - development
    tags:
      - "v*"
  pull_request:
    branches:
      - release
      - development

permissions:
  contents: write
  deployments: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

  verify-tag-on-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on release branch
        run: |
          git fetch origin release --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release"

  deploy-beta:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta')
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: rust-beta

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --all
      - run: cargo build --release
      - run: tar -czf tcknvkn-rust-${{ github.ref_name }}.tar.gz src tests examples Cargo.toml README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-rust-${{ github.ref_name }}
          path: tcknvkn-rust-${{ github.ref_name }}.tar.gz

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body: |
            Rust için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi beta sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/rust
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #rust #tcknvkn #tcuret #vknuret

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta')
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: rust-production

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --all
      - run: cargo build --release
      - run: tar -czf tcknvkn-rust-${{ github.ref_name }}.tar.gz src tests examples Cargo.toml README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-rust-${{ github.ref_name }}
          path: tcknvkn-rust-${{ github.ref_name }}.tar.gz

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            Rust için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi kararlı sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/nodejs
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #rust #tcknvkn #tcuret #vknuret
