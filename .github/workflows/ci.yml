name: CI

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  pull_request:
    branches:
      - release

permissions:
  contents: write
  deployments: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

  verify-tag-on-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.tag-bicimi.outputs.is_stable }}
      is_beta: ${{ steps.tag-bicimi.outputs.is_beta }}

    steps:
      # Etiket bicimi kapisi — on surumun kararli kanala sizmasini engeller.
      # GitHub Actions `if:` ifadelerinde regex yoktur; siniflandirma burada
      # yapilir ve yayin isleri yalnizca bu ciktilara bakar.
      #   vX.Y.Z         -> kararli
      #   vX.Y.Z-<onek>  -> on surum (-alpha, -beta, -rc, -preview, -dev ...)
      #   digerleri      -> FAIL (hicbir kanala gitmez)
      - name: Etiket bicimini siniflandir
        id: tag-bicimi
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "Kararli surum etiketi: $TAG"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "On surum etiketi: $TAG"
          else
            echo "::error::Gecersiz etiket bicimi: $TAG"
            echo "Beklenen: vX.Y.Z (kararli) veya vX.Y.Z-<onek> (on surum)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on release branch
        run: |
          git fetch origin release --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release"

      # Etiket manifest surumuyle ayni mi. Sapma yayin aninda degil etiket
      # aninda yakalanir: nuget csproj 1.0.0 derken NuGet'te 1.0.8 yayindaydi
      # ve sekiz yamalik fark aylarca kimsenin dikkatini cekmedi.
      # On surum eki karsilastirmaya girmez: v1.2.3-rc1 -> 1.2.3.
      - name: Etiket manifest surumuyle ayni mi
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          MANIFEST_VERSION=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$MANIFEST_VERSION" ]; then
            echo "::error::Manifest surumu okunamadi (Cargo.toml)."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Etiket ($TAG_VERSION) manifest surumuyle ($MANIFEST_VERSION) uyusmuyor."
            echo "Cargo.toml icindeki surumu guncelleyip yeniden etiketleyin."
            exit 1
          fi
          echo "Etiket ve manifest ayni: $MANIFEST_VERSION"

  release-beta:
    if: needs.verify-tag-on-release.outputs.is_beta == 'true'
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: rust-beta

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --all
      - run: cargo build --release
      - run: tar -czf tcknvkn-rust-${{ github.ref_name }}.tar.gz src tests examples Cargo.toml README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-rust-${{ github.ref_name }}
          path: tcknvkn-rust-${{ github.ref_name }}.tar.gz

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body: |
            Rust için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi beta sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/rust
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #rust #tcknvkn #tcuret #vknuret

  release-stable:
    if: needs.verify-tag-on-release.outputs.is_stable == 'true'
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: rust-production

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --all
      - run: cargo build --release
      - run: tar -czf tcknvkn-rust-${{ github.ref_name }}.tar.gz src tests examples Cargo.toml README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-rust-${{ github.ref_name }}
          path: tcknvkn-rust-${{ github.ref_name }}.tar.gz

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            Rust için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi kararlı sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/rust
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #rust #tcknvkn #tcuret #vknuret

  # Golden dataset tcknvkn/spec reposundan kopyalanmistir; ELLE DUZENLENMEZ.
  # Kopyalanan dosya zamanla sessizce ayrisir - biri duzeltilir, on sekizi eski
  # kalir. Bu kapi farki merge aninda yakalar.
  #
  # Dataset guncellendiginde: once tcknvkn/spec reposunda yeni surum etiketlenir,
  # sonra buradaki dosya ve asagidaki hash birlikte guncellenir.
  golden-dataset:
    runs-on: ubuntu-latest
    env:
      # tcknvkn/spec @ spec-v1.0.0
      GOLDEN_SHA256: e472cca15d825160877053da1e6e7078e8c1c18ef32fa25f5abb100bef217df9
    steps:
      - uses: actions/checkout@v4

      - name: Kopya kanonik surumle ayni mi
        run: |
          if ! echo "${GOLDEN_SHA256}  tests/golden-dataset.json" | sha256sum -c - ; then
            echo "::error::tests/golden-dataset.json kanonik surumden farkli."
            echo "beklenen: ${GOLDEN_SHA256}"
            echo "bulunan : $(sha256sum tests/golden-dataset.json | awk '{print $1}')"
            echo "kanonik kaynak: https://github.com/tcknvkn/spec (spec-v1.0.0)"
            exit 1
          fi
